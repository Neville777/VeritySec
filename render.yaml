services:
  - type: web
    name: veritysec-api
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: VERITYSEC_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "8765"
      - key: GIN_MODE
        value: release
      - key: TLS_ENABLED
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_ADDRESS
        sync: false
      - key: VERITYSEC_APP_URL
        sync: false
